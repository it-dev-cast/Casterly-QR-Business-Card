<!doctype html>
<html lang="en" data-theme="casterly-light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>CardDesk · QR Business Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/theme.js"></script>
  <script src="/theme-picker.js" defer></script>
  <script src="/vendor/qrcode.js" defer></script>
  <script src="/card.js" defer></script>
  <script src="/card-image.js" defer></script>
  <script src="/api.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body class="app-atmosphere">
  <div id="bootView" class="boot-view"><span class="spinner" aria-hidden="true"></span><span class="sr-only">Loading…</span></div>

  <!-- ============ LOGIN ============ -->
  <section id="loginView" class="login-view" hidden>
    <div class="login-theme"><div data-theme-picker></div></div>
    <form id="loginForm" class="surface login-card" autocomplete="off" novalidate>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><img src="/favicon.svg" alt="" /></div>
        <div>
          <p class="text-eyebrow">NEXUS One</p>
          <h1>CardDesk</h1>
        </div>
      </div>
      <div>
        <h2 class="text-title">Sign in</h2>
        <p class="text-muted">QR business cards for employees in nexusAuth.</p>
      </div>

      <label class="field">
        <span>Email</span>
        <input id="loginEmail" type="email" placeholder="you@company.com" autocomplete="username" />
      </label>
      <label class="field">
        <span>Password</span>
        <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
      </label>
      <p id="loginError" class="form-error" role="alert"></p>
      <button id="loginBtn" class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
      <p class="hint">Use your nexusAuth account (admin or operator).</p>
    </form>
  </section>

  <!-- ============ APP ============ -->
  <section id="appView" class="app-view" hidden>
    <header class="topbar">
      <div class="brand small">
        <div class="brand-mark" aria-hidden="true"><img src="/favicon.svg" alt="" /></div>
        <div class="brand-text">
          <span class="text-eyebrow">NEXUS One</span>
          <strong>CardDesk</strong>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="logoutBtn" class="btn btn-ghost btn-sm">Log out <span id="userEmail" class="user-email"></span></button>
        <span class="topbar-divider" aria-hidden="true"></span>
        <div data-theme-picker></div>
      </div>
    </header>

    <div class="page-header">
      <div class="page-heading">
        <h1 class="text-headline">Business Cards</h1>
        <p class="text-muted">Employee details come from nexusAuth. Change them there; cards update automatically. <span id="syncStatus" class="sync-status"></span></p>
      </div>
      <div class="page-actions">
        <button id="bannerBtn" class="btn btn-outline">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          Card branding
        </button>
        <button id="syncBtn" class="btn btn-primary" data-tooltip="Fetch the latest employee details from nexusAuth">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></svg>
          Sync now
        </button>
      </div>
    </div>

    <main class="layout">
      <aside class="panel surface list-panel" aria-label="Employees">
        <div class="panel-head">
          <h2>Employees <span id="empCount" class="count"></span></h2>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="Search name, role, company…" aria-label="Search employees" />
        </div>
        <ul id="employeeList" class="employee-list"></ul>
      </aside>

      <section class="panel surface details-panel" id="detailsPanel" aria-label="Employee details"></section>

      <section class="panel preview-panel" aria-label="Card preview">
        <div class="phone">
          <div class="phone-notch"></div>
          <div class="phone-screen" id="cardMount"></div>
        </div>
        <p class="preview-caption">Live preview · 9:16</p>
      </section>
    </main>
  </section>

  <!-- ============ MODALS ============ -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-dialog surface" role="dialog" aria-modal="true" id="modalDialog"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
